<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chip's Quest">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icon.png">
<title>Chip's Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap">
<style>
  /* Layout: portrait column — top bar, square 9x9 board, inventory strip, D-pad. Menus are overlay cards. */
  :root {
    --bg: #0b1020;
    --panel: #161d36;
    --panel-2: #222b4d;
    --line: #36416e;
    --text: #e9edff;
    --muted: #8f99c7;
    --chip: #5cf08a;
    --gold: #ffcc33;
    --danger: #ff5a6a;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --body: "Nunito", -apple-system, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
  #top { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; }
  .stat { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .stat .lbl { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; font-weight: 900; }
  .stat b { font-family: var(--pixel); font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  #chipStat b { color: var(--chip); }
  #timeStat.low b { color: var(--danger); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #lvlName { flex: 1; min-width: 0; text-align: center; font-family: var(--pixel); font-size: 10px; line-height: 1.5; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lvlName span { color: var(--text); }
  .iconbtn { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 2px solid var(--line); display: grid; place-items: center; padding: 0; }
  .iconbtn svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn:active { background: var(--panel-2); }

  #boardWrap { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; position: relative; }
  #board { display: block; border-radius: 8px; border: 3px solid var(--line); box-shadow: 0 0 0 3px #05070f, 0 12px 30px rgba(0,0,0,.5); image-rendering: pixelated; }
  #hintBox { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(92%, 440px); background: rgba(10,14,32,.94); border: 2px solid var(--gold); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.35; font-weight: 700; pointer-events: none; }
  #hintBox::before { content: "HINT"; display: block; font-family: var(--pixel); font-size: 9px; color: var(--gold); margin-bottom: 5px; }

  #inv { display: flex; gap: 5px; justify-content: center; max-width: 100%; }
  #inv .slot { width: clamp(24px, calc((100vw - 80px) / 9), 34px); aspect-ratio: 1; border-radius: 6px; background: var(--panel); border: 2px solid var(--line); position: relative; }
  #inv .slot canvas { width: 100%; height: 100%; display: block; border-radius: 4px; }
  #inv .slot.off canvas { opacity: .14; filter: grayscale(1); }
  #inv .slot i { position: absolute; right: -4px; bottom: -4px; background: var(--text); color: var(--bg); font-style: normal; font-family: var(--pixel); font-size: 8px; padding: 2px 3px; border-radius: 4px; }
  #inv .sep { width: 8px; }

  #pad { position: relative; width: 168px; height: 168px; flex: none; }
  #pad button { position: absolute; width: 58px; height: 58px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 4px 0 #05070f; display: grid; place-items: center; touch-action: none; }
  #pad button.on { background: var(--panel-2); transform: translateY(3px); box-shadow: 0 1px 0 #05070f; }
  #pad svg { width: 26px; height: 26px; fill: var(--text); }
  #pad [data-dir=up] { left: 55px; top: 0; }
  #pad [data-dir=down] { left: 55px; bottom: 0; }
  #pad [data-dir=left] { left: 0; top: 55px; }
  #pad [data-dir=right] { right: 0; top: 55px; }
  #pad .hub { position: absolute; left: 62px; top: 62px; width: 44px; height: 44px; border-radius: 50%; background: #0f1530; border: 2px solid var(--line); }
  @media (max-width: 370px) {
    .stat { min-width: 54px; padding: 5px 6px; }
    .iconbtn { width: 36px; height: 36px; }
    #lvlName { font-size: 8px; }
    #top { gap: 6px; }
  }
  @media (max-height: 640px) {
    #pad { width: 138px; height: 138px; }
    #pad button { width: 48px; height: 48px; }
    #pad [data-dir=up], #pad [data-dir=down] { left: 45px; }
    #pad [data-dir=left], #pad [data-dir=right] { top: 45px; }
    #pad .hub { left: 51px; top: 51px; width: 36px; height: 36px; }
  }
  @media (pointer: fine) and (min-height: 760px) { #pad { opacity: .9; } }

  /* Overlays */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: rgba(5,7,15,.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { width: min(100%, 420px); max-height: 100%; overflow: auto; background: var(--panel); border: 3px solid var(--line); border-radius: 16px; padding: 22px 20px; text-align: center; box-shadow: 0 6px 0 #05070f; touch-action: pan-y; }
  .card h1 { font-family: var(--pixel); font-size: 26px; line-height: 1.3; margin: 4px 0 6px; color: var(--chip); text-shadow: 3px 3px 0 #0a3a1e; }
  .card h2 { font-family: var(--pixel); font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
  .card .kicker { font-family: var(--pixel); font-size: 10px; color: var(--muted); letter-spacing: .1em; }
  .card p { margin: 8px 0; font-size: 16px; line-height: 1.45; color: #c9d0f2; }
  .card .big { width: 100%; padding: 15px; margin-top: 12px; border-radius: 12px; border: 0; background: var(--chip); color: #062312; font-family: var(--pixel); font-size: 13px; box-shadow: 0 4px 0 #1f8a45; }
  .card .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #1f8a45; }
  .card .ghost { width: 100%; padding: 12px; margin-top: 10px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--text); font-weight: 900; font-size: 15px; }
  .card button:focus-visible, .iconbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
  #levels button { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); font-family: var(--pixel); font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
  #levels button small { font-family: var(--body); font-size: 10px; color: var(--chip); font-weight: 900; }
  #levels button:disabled { opacity: .35; cursor: default; }
  #levels button.done { border-color: var(--chip); }
  .titleArt { display: block; margin: 0 auto 6px; width: 96px; height: 96px; image-rendering: pixelated; }
  .help { text-align: left; font-size: 14px !important; color: var(--muted) !important; }
  #muteBtn.muted svg .wave { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="iconbtn" id="menuBtn" aria-label="Level select"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="stat" id="chipStat"><span class="lbl">Chips</span><b id="chipsLeft">0</b></div>
    <div id="lvlName">LEVEL <span id="lvlNum">1</span><br><span id="lvlTitle"></span></div>
    <div class="stat" id="timeStat"><span class="lbl">Time</span><b id="timeLeft">---</b></div>
    <button class="iconbtn" id="restartBtn" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
  </div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="hintBox" hidden></div>
  </div>
  <div id="inv"></div>
  <div id="pad">
    <div class="hub"></div>
    <button data-dir="up" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></button>
    <button data-dir="left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M5 12l11-8v16z"/></svg></button>
    <button data-dir="right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M19 12L8 4v16z"/></svg></button>
    <button data-dir="down" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M12 19l8-11H4z"/></svg></button>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <canvas class="titleArt" id="titleArt" width="96" height="96"></canvas>
    <h1>CHIP'S<br>QUEST</h1>
    <p>Collect the computer chips, dodge the monsters, and find the exit.</p>
    <div id="levels"></div>
    <p class="help">Swipe on the board or use the D-pad. Hold to keep walking. On a keyboard, use the arrow keys or WASD.</p>
    <button class="ghost" id="muteBtn" aria-pressed="false">Sound: On</button>
  </div>
</div>

<div class="overlay" id="intro" hidden>
  <div class="card">
    <div class="kicker" id="introKicker">LEVEL 1</div>
    <h2 id="introTitle"></h2>
    <p id="introInfo"></p>
    <button class="big" id="startBtn">START</button>
  </div>
</div>

<div class="overlay" id="dead" hidden>
  <div class="card">
    <div class="kicker">OOPS!</div>
    <h2 style="color:var(--danger)">GAME OVER</h2>
    <p id="deadMsg"></p>
    <button class="big" id="retryBtn">TRY AGAIN</button>
    <button class="ghost" data-act="menu">Level select</button>
  </div>
</div>

<div class="overlay" id="won" hidden>
  <div class="card">
    <div class="kicker">LEVEL COMPLETE</div>
    <h2 style="color:var(--chip)" id="wonTitle">NICE WORK!</h2>
    <p id="wonInfo"></p>
    <button class="big" id="nextBtn">NEXT LEVEL</button>
    <button class="ghost" data-act="menu">Level select</button>
  </div>
</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script>
(() => {
  const E = window.ChipEngine, LEVELS = window.CHIP_LEVELS;
  const TICK = 100, VIEW = 9;
  const $ = id => document.getElementById(id);
  const board = $('board'), ctx = board.getContext('2d');

  // ---------- Saved progress (per-browser; works without storage too) ----------
  const SAVE_KEY = 'chipsquest-v1';
  let save = { unlocked: 1, best: {}, muted: false };
  try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

  // ---------- Sound ----------
  let actx = null;
  function unlockAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function tone(freqs, dur = 0.08, type = 'square', vol = 0.06) {
    if (!actx || save.muted) return;
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const s = t0 + i * dur;
      g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(0.0001, s + dur * 0.95);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + dur);
    });
  }
  const SFX = {
    chip: () => tone([880, 1320], 0.06),
    item: () => tone([660, 990, 1320], 0.05),
    door: () => tone([300, 450], 0.07, 'triangle', 0.1),
    push: () => tone([140], 0.05, 'triangle', 0.08),
    splash: () => tone([400, 200, 120], 0.06, 'sawtooth', 0.05),
    bump: () => tone([90], 0.04, 'square', 0.03),
    die: () => tone([400, 300, 200, 120], 0.12, 'sawtooth', 0.07),
    win: () => tone([523, 659, 784, 1047], 0.11, 'square', 0.06),
  };

  // ---------- Drawing ----------
  const C = {
    floor: '#c9ccd6', floorEdge: '#a9adbb', wall: '#3a4677', wallHi: '#5b69a6', wallLo: '#232c52',
    key: { r: '#ff4d5e', b: '#3f8cff', y: '#ffd23f', g: '#3fd47a' },
  };
  function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

  function drawFloor(c, x, y, s) {
    c.fillStyle = C.floor; c.fillRect(x, y, s, s);
    c.fillStyle = C.floorEdge; c.fillRect(x, y + s - s * .06, s, s * .06); c.fillRect(x + s - s * .06, y, s * .06, s);
    c.fillStyle = '#dfe2ea'; c.fillRect(x, y, s, s * .05); c.fillRect(x, y, s * .05, s);
  }
  function drawWall(c, x, y, s) {
    c.fillStyle = C.wall; c.fillRect(x, y, s, s);
    c.fillStyle = C.wallHi; c.fillRect(x, y, s, s * .12); c.fillRect(x, y, s * .12, s);
    c.fillStyle = C.wallLo; c.fillRect(x, y + s * .88, s, s * .12); c.fillRect(x + s * .88, y, s * .12, s);
    c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(x + s * .3, y + s * .3, s * .4, s * .4);
  }
  function drawChip(c, x, y, s) {
    const m = s * .22, w = s - m * 2;
    c.fillStyle = '#d7a928';
    for (let i = 0; i < 4; i++) {
      const o = m + w * (0.14 + i * 0.24);
      c.fillRect(x + o, y + m - s * .08, s * .07, s * .1); c.fillRect(x + o, y + s - m - s * .02, s * .07, s * .1);
      c.fillRect(x + m - s * .08, y + o, s * .1, s * .07); c.fillRect(x + s - m - s * .02, y + o, s * .1, s * .07);
    }
    rr(c, x + m, y + m, w, w, s * .06); c.fillStyle = '#1b1f2b'; c.fill();
    c.fillStyle = '#3a4258'; c.fillRect(x + m + w * .2, y + m + w * .2, w * .6, w * .6);
    c.fillStyle = '#ffcc33'; c.beginPath(); c.arc(x + m + w * .3, y + m + w * .3, s * .04, 0, 7); c.fill();
  }
  function drawSocket(c, x, y, s) {
    c.fillStyle = '#20553a'; c.fillRect(x, y, s, s);
    c.strokeStyle = '#5cf08a'; c.lineWidth = Math.max(1, s * .05);
    for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(x + s * i / 4, y + s * .08); c.lineTo(x + s * i / 4, y + s * .92); c.stroke(); }
    c.strokeRect(x + s * .08, y + s * .08, s * .84, s * .84);
    c.save(); c.globalAlpha = .9; drawChip(c, x + s * .2, y + s * .2, s * .6); c.restore();
  }
  function drawExit(c, x, y, s, t) {
    c.fillStyle = '#0a1240'; c.fillRect(x, y, s, s);
    const cx = x + s / 2, cy = y + s / 2;
    for (let i = 5; i > 0; i--) {
      const r = s * .46 * i / 5, ph = t * 3 + i;
      c.fillStyle = `hsl(${190 + i * 14 + Math.sin(ph) * 10}, 90%, ${45 + i * 6}%)`;
      c.beginPath(); c.arc(cx, cy, r * (0.92 + 0.08 * Math.sin(ph * 1.3)), 0, 7); c.fill();
    }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(cx, cy, s * .07, 0, 7); c.fill();
  }
  function drawKey(c, x, y, s, col) {
    c.save(); c.translate(x + s / 2, y + s / 2); c.rotate(-0.6);
    c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = Math.max(1, s * .04);
    c.beginPath(); c.arc(-s * .16, 0, s * .17, 0, 7); c.fill(); c.stroke();
    c.fillRect(-s * .02, -s * .05, s * .36, s * .1); c.strokeRect(-s * .02, -s * .05, s * .36, s * .1);
    c.fillRect(s * .2, s * .05, s * .07, s * .1); c.fillRect(s * .08, s * .05, s * .07, s * .08);
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(-s * .16, 0, s * .06, 0, 7); c.fill();
    c.restore();
  }
  function drawDoor(c, x, y, s, col) {
    c.fillStyle = col; c.fillRect(x, y, s, s);
    c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(x, y, s, s * .1); c.fillRect(x, y, s * .1, s);
    c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x, y + s * .9, s, s * .1); c.fillRect(x + s * .9, y, s * .1, s);
    c.fillStyle = 'rgba(0,0,0,.6)'; c.beginPath(); c.arc(x + s / 2, y + s * .42, s * .1, 0, 7); c.fill();
    c.beginPath(); c.moveTo(x + s * .45, y + s * .45); c.lineTo(x + s * .55, y + s * .45); c.lineTo(x + s * .59, y + s * .7); c.lineTo(x + s * .41, y + s * .7); c.fill();
  }
  function drawWater(c, x, y, s, t) {
    c.fillStyle = '#1d5fd1'; c.fillRect(x, y, s, s);
    c.strokeStyle = '#7fb4ff'; c.lineWidth = Math.max(1, s * .05);
    for (let i = 0; i < 3; i++) {
      const yy = y + s * (0.22 + i * 0.3);
      c.beginPath();
      for (let k = 0; k <= 8; k++) {
        const xx = x + s * k / 8;
        const wy = yy + Math.sin(t * 3 + k * 0.9 + i * 2 + x * .05) * s * .05;
        k ? c.lineTo(xx, wy) : c.moveTo(xx, wy);
      }
      c.stroke();
    }
  }
  function drawFire(c, x, y, s, t) {
    c.fillStyle = '#5a1206'; c.fillRect(x, y, s, s);
    const cols = ['#ff3b1f', '#ff8a1f', '#ffd23f'];
    cols.forEach((col, j) => {
      c.fillStyle = col;
      for (let i = 0; i < 3; i++) {
        const fx = x + s * (0.2 + i * 0.3), h = s * (0.75 - j * 0.2) * (0.85 + 0.15 * Math.sin(t * 9 + i * 2 + j + x));
        const w = s * (0.17 - j * 0.04);
        c.beginPath(); c.moveTo(fx - w, y + s * .95); c.quadraticCurveTo(fx - w, y + s * .95 - h * .5, fx, y + s * .95 - h);
        c.quadraticCurveTo(fx + w, y + s * .95 - h * .5, fx + w, y + s * .95); c.fill();
      }
    });
  }
  function drawIce(c, x, y, s) {
    c.fillStyle = '#bfeeff'; c.fillRect(x, y, s, s);
    c.fillStyle = 'rgba(255,255,255,.8)';
    c.beginPath(); c.moveTo(x + s * .15, y + s * .5); c.lineTo(x + s * .5, y + s * .15); c.lineTo(x + s * .58, y + s * .15); c.lineTo(x + s * .15, y + s * .58); c.fill();
    c.beginPath(); c.moveTo(x + s * .5, y + s * .85); c.lineTo(x + s * .85, y + s * .5); c.lineTo(x + s * .85, y + s * .58); c.lineTo(x + s * .58, y + s * .85); c.fill();
    c.strokeStyle = '#8fd3ee'; c.lineWidth = Math.max(1, s * .04); c.strokeRect(x + 0.5, y + 0.5, s - 1, s - 1);
  }
  function drawForce(c, x, y, s, t, dir) {
    c.fillStyle = '#2f6b3c'; c.fillRect(x, y, s, s);
    c.save(); c.beginPath(); c.rect(x, y, s, s); c.clip();
    c.translate(x + s / 2, y + s / 2);
    c.rotate({ right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir]);
    const off = ((t * 2) % 1) * s / 2;
    c.strokeStyle = '#9ff0a8'; c.lineWidth = s * .09; c.lineCap = 'round'; c.lineJoin = 'round';
    for (let i = -2; i <= 1; i++) {
      const ax = i * s / 2 + off;
      c.beginPath(); c.moveTo(ax - s * .12, -s * .2); c.lineTo(ax + s * .08, 0); c.lineTo(ax - s * .12, s * .2); c.stroke();
    }
    c.restore();
  }
  function drawDirt(c, x, y, s) {
    c.fillStyle = '#8a5a2b'; c.fillRect(x, y, s, s);
    c.fillStyle = '#6a421c';
    [[.2, .25], [.6, .2], [.4, .55], [.75, .65], [.2, .75], [.55, .85]].forEach(([a, b]) => { c.beginPath(); c.arc(x + s * a, y + s * b, s * .06, 0, 7); c.fill(); });
  }
  function drawHint(c, x, y, s) {
    drawFloor(c, x, y, s);
    c.fillStyle = '#3f6fe0'; c.beginPath(); c.arc(x + s / 2, y + s / 2, s * .3, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.font = `900 ${Math.round(s * .42)}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('?', x + s / 2, y + s / 2 + s * .02);
  }
  function drawBoot(c, x, y, s, kind) {
    const col = { f: '#2ec4ff', h: '#ff5a2a', k: '#d8dde8', x: '#55d16f' }[kind];
    c.save(); c.translate(x, y);
    if (kind === 'f') {
      c.fillStyle = col; c.strokeStyle = '#0b4a73'; c.lineWidth = s * .04;
      c.beginPath(); c.moveTo(s * .32, s * .2); c.lineTo(s * .52, s * .2); c.lineTo(s * .55, s * .5); c.lineTo(s * .85, s * .82); c.lineTo(s * .2, s * .82); c.lineTo(s * .3, s * .5); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(s * .4, s * .82); c.lineTo(s * .45, s * .6); c.moveTo(s * .6, s * .82); c.lineTo(s * .55, s * .62); c.stroke();
    } else {
      c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = s * .04;
      c.beginPath(); c.moveTo(s * .3, s * .15); c.lineTo(s * .55, s * .15); c.lineTo(s * .55, s * .5); c.lineTo(s * .8, s * .58); c.lineTo(s * .8, s * .72); c.lineTo(s * .25, s * .72); c.closePath(); c.fill(); c.stroke();
      if (kind === 'k') { c.strokeStyle = '#6b7488'; c.lineWidth = s * .06; c.beginPath(); c.moveTo(s * .18, s * .84); c.lineTo(s * .86, s * .84); c.moveTo(s * .35, s * .72); c.lineTo(s * .35, s * .84); c.moveTo(s * .7, s * .72); c.lineTo(s * .7, s * .84); c.stroke(); }
      if (kind === 'h') { c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(s * .38, s * .45); c.quadraticCurveTo(s * .3, s * .3, s * .42, s * .22); c.quadraticCurveTo(s * .42, s * .34, s * .5, s * .38); c.quadraticCurveTo(s * .5, s * .48, s * .38, s * .45); c.fill(); }
      if (kind === 'x') { c.fillStyle = '#1d6b31'; [.33, .5, .67].forEach(a => { c.beginPath(); c.arc(s * a, s * .8, s * .07, 0, 7); c.fill(); }); }
    }
    c.restore();
  }
  function drawBlock(c, x, y, s) {
    c.fillStyle = '#b07a3e'; c.fillRect(x + s * .04, y + s * .04, s * .92, s * .92);
    c.strokeStyle = '#6e4519'; c.lineWidth = s * .07; c.strokeRect(x + s * .08, y + s * .08, s * .84, s * .84);
    c.beginPath(); c.moveTo(x + s * .1, y + s * .1); c.lineTo(x + s * .9, y + s * .9); c.moveTo(x + s * .9, y + s * .1); c.lineTo(x + s * .1, y + s * .9); c.stroke();
  }
  function drawTerrain(c, ch, x, y, s, t) {
    switch (ch) {
      case '#': return drawWall(c, x, y, s);
      case 'S': return drawSocket(c, x, y, s);
      case 'E': return drawExit(c, x, y, s, t);
      case '~': return drawWater(c, x, y, s, t);
      case '&': return drawFire(c, x, y, s, t);
      case '_': return drawIce(c, x, y, s);
      case '%': return drawDirt(c, x, y, s);
      case '?': return drawHint(c, x, y, s);
      case 'R': case 'B': case 'Y': case 'G': return drawDoor(c, x, y, s, C.key[ch.toLowerCase()]);
    }
    if (E.FORCE[ch]) return drawForce(c, x, y, s, t, E.FORCE[ch]);
    drawFloor(c, x, y, s);
    if (ch === 'c') drawChip(c, x, y, s);
    else if (C.key[ch]) drawKey(c, x, y, s, C.key[ch]);
    else if ('fhkx'.includes(ch)) drawBoot(c, x, y, s, ch);
  }
  function drawMonster(c, m, x, y, s, t) {
    const cx = x + s / 2, cy = y + s / 2;
    c.save(); c.translate(cx, cy);
    if (m.kind === 'ball') {
      const sq = 1 + Math.sin(t * 12) * .06;
      c.scale(sq, 2 - sq);
      const g = c.createRadialGradient(-s * .1, -s * .12, s * .03, 0, 0, s * .36);
      g.addColorStop(0, '#ffd0ea'); g.addColorStop(1, '#e23d9a');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, s * .34, 0, 7); c.fill();
    } else if (m.kind === 'bug') {
      c.rotate({ up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[m.dir]);
      c.strokeStyle = '#3a1010'; c.lineWidth = s * .05;
      for (let i = -1; i <= 1; i++) { const w = Math.sin(t * 20 + i) * s * .05; c.beginPath(); c.moveTo(-s * .38, i * s * .14 + w); c.lineTo(s * .38, i * s * .14 - w); c.stroke(); }
      c.fillStyle = '#d42828'; c.beginPath(); c.ellipse(0, s * .06, s * .24, s * .3, 0, 0, 7); c.fill();
      c.fillStyle = '#2a0a0a'; c.beginPath(); c.arc(0, -s * .24, s * .13, 0, 7); c.fill();
      c.beginPath(); c.moveTo(0, -s * .22); c.lineTo(0, s * .34); c.strokeStyle = '#2a0a0a'; c.stroke();
    } else {
      const open = (Math.sin(t * 10) + 1) / 2;
      c.fillStyle = '#4ad66d'; rr(c, -s * .36, -s * .32, s * .72, s * .64, s * .16); c.fill();
      c.fillStyle = '#103a1c'; c.fillRect(-s * .28, -s * .02 - open * s * .1, s * .56, s * .04 + open * s * .2);
      c.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) {
        const tx = -s * .26 + i * s * .14;
        c.beginPath(); c.moveTo(tx, -s * .04 - open * s * .1); c.lineTo(tx + s * .07, s * .06 - open * s * .1); c.lineTo(tx + s * .12, -s * .04 - open * s * .1); c.fill();
        c.beginPath(); c.moveTo(tx, s * .06 + open * s * .1); c.lineTo(tx + s * .07, -s * .04 + open * s * .1); c.lineTo(tx + s * .12, s * .06 + open * s * .1); c.fill();
      }
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-s * .14, -s * .2, s * .07, 0, 7); c.arc(s * .14, -s * .2, s * .07, 0, 7); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(-s * .14, -s * .19, s * .035, 0, 7); c.arc(s * .14, -s * .19, s * .035, 0, 7); c.fill();
    }
    c.restore();
  }
  function drawPlayer(c, p, x, y, s, t, state) {
    const cx = x + s / 2;
    const swimming = state.t[p.y * state.w + p.x] === '~' && state.boots.f;
    const bob = Math.sin(t * 14) * s * .02 * (t - lastMoveT < .25 ? 1 : 0);
    const [ex, ey] = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[p.dir];
    c.save(); c.translate(0, bob);
    // shadow
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(cx, y + s * .88, s * .26, s * .07, 0, 0, 7); c.fill();
    if (!swimming) {
      c.fillStyle = '#2b3a8f'; c.fillRect(cx - s * .16, y + s * .7, s * .12, s * .16); c.fillRect(cx + s * .04, y + s * .7, s * .12, s * .16);
    }
    // body
    c.fillStyle = '#ffb347'; rr(c, cx - s * .22, y + s * .46, s * .44, s * .3, s * .08); c.fill();
    c.fillStyle = '#e08a1e'; c.fillRect(cx - s * .22, y + s * .56, s * .44, s * .05);
    // head
    c.fillStyle = '#f6c9a0'; c.beginPath(); c.arc(cx, y + s * .33, s * .21, 0, 7); c.fill();
    // hair
    c.fillStyle = '#5a3416'; c.beginPath(); c.arc(cx, y + s * .3, s * .21, Math.PI * 1.05, Math.PI * 1.95); c.fill();
    c.fillRect(cx - s * .2, y + s * .2, s * .4, s * .05);
    if (p.dir !== 'up') {
      // glasses
      const gx = cx + ex * s * .06, gy = y + s * .35 + ey * s * .02;
      c.strokeStyle = '#1b1f2b'; c.lineWidth = Math.max(1, s * .035);
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.arc(gx - s * .08, gy, s * .065, 0, 7); c.fill(); c.stroke();
      c.beginPath(); c.arc(gx + s * .08, gy, s * .065, 0, 7); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(gx - s * .015, gy); c.lineTo(gx + s * .015, gy); c.stroke();
      c.fillStyle = '#1b1f2b';
      c.beginPath(); c.arc(gx - s * .08 + ex * s * .02, gy + ey * s * .015, s * .022, 0, 7); c.arc(gx + s * .08 + ex * s * .02, gy + ey * s * .015, s * .022, 0, 7); c.fill();
    } else {
      c.fillStyle = '#5a3416'; c.beginPath(); c.arc(cx, y + s * .33, s * .2, 0, 7); c.fill();
    }
    c.restore();
    if (swimming) { c.fillStyle = 'rgba(29,95,209,.75)'; c.fillRect(x, y + s * .62, s, s * .38); }
  }

  // ---------- Game state ----------
  let levelIdx = 0, state = null, running = false, acc = 0, lastT = 0, tickStart = 0, lastMoveT = 0;
  let held = null, queued = null;

  function loadLevel(i) {
    levelIdx = i;
    state = E.load(LEVELS[i]);
    running = false; acc = 0; held = null; queued = null;
    $('lvlNum').textContent = i + 1;
    $('lvlTitle').textContent = LEVELS[i].name;
    updateHud(); buildInv();
    hideAll();
    const L = LEVELS[i];
    $('introKicker').textContent = `LEVEL ${i + 1} OF ${LEVELS.length}`;
    $('introTitle').textContent = L.name;
    $('introInfo').textContent = `${state.chipsTotal} chips to collect. ` + (L.time ? `Time limit: ${L.time} seconds.` : 'No time limit.');
    $('intro').hidden = false;
  }
  function start() { unlockAudio(); hideAll(); running = true; lastT = performance.now(); acc = 0; }
  function hideAll() { ['menu', 'intro', 'dead', 'won'].forEach(id => $(id).hidden = true); }

  function updateHud() {
    $('chipsLeft').textContent = state.chipsLeft;
    $('timeLeft').textContent = state.limit ? state.timeLeft : '---';
    $('timeStat').classList.toggle('low', !!state.limit && state.timeLeft <= 15 && state.status === 'play');
    const onHint = state.t[state.p.y * state.w + state.p.x] === '?' && LEVELS[levelIdx].hint;
    $('hintBox').hidden = !onHint;
    if (onHint) $('hintBox').textContent = LEVELS[levelIdx].hint;
  }

  // Inventory slots, each a tiny canvas reusing the tile art.
  const INV = [['r', 'key'], ['b', 'key'], ['y', 'key'], ['g', 'key'], null, ['f', 'boot'], ['h', 'boot'], ['k', 'boot'], ['x', 'boot']];
  const invEls = {};
  (function makeInv() {
    const inv = $('inv');
    INV.forEach(it => {
      if (!it) { const sp = document.createElement('div'); sp.className = 'sep'; inv.appendChild(sp); return; }
      const slot = document.createElement('div'); slot.className = 'slot off';
      const cv = document.createElement('canvas'); const px = 34 * Math.min(3, window.devicePixelRatio || 1);
      cv.width = cv.height = px;
      const cc = cv.getContext('2d');
      if (it[1] === 'key') drawKey(cc, 0, 0, px, C.key[it[0]]); else drawBoot(cc, 0, 0, px, it[0]);
      const n = document.createElement('i'); n.hidden = true;
      slot.append(cv, n); inv.appendChild(slot);
      invEls[it[0]] = { slot, n, kind: it[1] };
    });
  })();
  function buildInv() {
    for (const k in invEls) {
      const e = invEls[k];
      const v = e.kind === 'key' ? state.keys[k] : state.boots[k];
      e.slot.classList.toggle('off', !v);
      e.n.hidden = !(e.kind === 'key' && v > 1 && k !== 'g');
      e.n.textContent = v;
    }
  }

  function onWin() {
    running = false;
    const prevBest = save.best[levelIdx];
    const score = state.limit ? state.timeLeft : null;
    if (score != null && (prevBest == null || score > prevBest)) save.best[levelIdx] = score;
    else if (prevBest == null) save.best[levelIdx] = 0;
    save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, levelIdx + 2));
    persist();
    const last = levelIdx === LEVELS.length - 1;
    $('wonTitle').textContent = last ? 'YOU BEAT THE GAME!' : 'NICE WORK!';
    $('wonInfo').textContent = state.limit ? `Finished with ${state.timeLeft} seconds to spare.` : 'All chips collected!';
    $('nextBtn').textContent = last ? 'PLAY AGAIN' : 'NEXT LEVEL';
    setTimeout(() => { $('won').hidden = false; }, 450);
  }
  function onDie() {
    running = false;
    $('deadMsg').textContent = state.msg;
    setTimeout(() => { $('dead').hidden = false; }, 550);
  }

  function showMenu() {
    running = false; hideAll();
    const grid = $('levels'); grid.innerHTML = '';
    LEVELS.forEach((L, i) => {
      const b = document.createElement('button');
      const done = save.best[i] != null;
      b.disabled = i >= save.unlocked;
      b.className = done ? 'done' : '';
      b.innerHTML = `${i + 1}${done ? '<small>✓</small>' : ''}`;
      b.setAttribute('aria-label', `Level ${i + 1}: ${L.name}${done ? ', completed' : ''}`);
      b.onclick = () => { unlockAudio(); loadLevel(i); };
      grid.appendChild(b);
    });
    $('muteBtn').textContent = `Sound: ${save.muted ? 'Off' : 'On'}`;
    $('menu').hidden = false;
  }

  // ---------- Loop ----------
  function frame(now) {
    if (running) {
      acc += Math.min(250, now - lastT);
      while (acc >= TICK && running) {
        acc -= TICK;
        const input = held || queued;
        const prevPos = state.p.x + ',' + state.p.y;
        const prevInv = JSON.stringify([state.keys, state.boots]);
        E.step(state, input);
        tickStart = now - acc;
        if (state.consumed) queued = null;
        if (state.p.x + ',' + state.p.y !== prevPos) lastMoveT = now / 1000;
        state.events.forEach(ev => SFX[ev] && SFX[ev]());
        if (JSON.stringify([state.keys, state.boots]) !== prevInv) buildInv();
        updateHud();
        if (state.status === 'won') onWin();
        else if (state.status === 'dead') onDie();
      }
    }
    lastT = now;
    render(now);
    requestAnimationFrame(frame);
  }

  function lerpPos(o, now) {
    if (!state) return [o.x, o.y];
    const ticks = state.tick - 1 + (running ? Math.min(1, (now - tickStart) / TICK) : 99);
    const k = Math.max(0, Math.min(1, (ticks - o.mt + 1) / (o.dur || 2)));
    return [o.fx + (o.x - o.fx) * k, o.fy + (o.y - o.fy) * k];
  }

  let tile = 40, dpr = 1;
  function resize() {
    const wrap = $('boardWrap');
    const avail = Math.min(wrap.clientWidth, wrap.clientHeight) - 6;
    tile = Math.max(16, Math.floor(avail / VIEW));
    dpr = Math.min(3, window.devicePixelRatio || 1);
    const css = tile * VIEW;
    board.style.width = board.style.height = css + 'px';
    board.width = board.height = Math.round(css * dpr);
  }
  window.addEventListener('resize', resize);

  function render(now) {
    if (!state) return;
    const t = now / 1000, s = tile;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, s * VIEW, s * VIEW);
    const [px, py] = lerpPos(state.p, now);
    const cam = (pos, size) => size <= VIEW ? -(VIEW - size) / 2 : Math.max(0, Math.min(size - VIEW, pos - (VIEW - 1) / 2));
    const camX = cam(px, state.w), camY = cam(py, state.h);
    const x0 = Math.floor(camX), y0 = Math.floor(camY);
    for (let y = y0; y <= y0 + VIEW; y++) {
      for (let x = x0; x <= x0 + VIEW; x++) {
        if (x < 0 || y < 0 || x >= state.w || y >= state.h) continue;
        drawTerrain(ctx, state.t[y * state.w + x], Math.round((x - camX) * s), Math.round((y - camY) * s), s, t);
      }
    }
    state.blocks.forEach((b, i) => {
      const bx = i % state.w, by = (i / state.w) | 0;
      const [lx, ly] = lerpPos({ x: bx, y: by, fx: b.fx, fy: b.fy, mt: b.mt, dur: 2 }, now);
      drawBlock(ctx, (lx - camX) * s, (ly - camY) * s, s);
    });
    state.mons.forEach(m => { const [mx, my] = lerpPos(m, now); drawMonster(ctx, m, (mx - camX) * s, (my - camY) * s, s, t); });
    if (state.status !== 'dead' || Math.floor(t * 8) % 2) drawPlayer(ctx, state.p, (px - camX) * s, (py - camY) * s, s, t, state);
    if (state.status === 'won') { ctx.fillStyle = `rgba(92,240,138,${0.15 + 0.1 * Math.sin(t * 10)})`; ctx.fillRect(0, 0, s * VIEW, s * VIEW); }
  }

  // ---------- Input ----------
  const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  window.addEventListener('keydown', e => {
    const d = KEYMAP[e.key];
    if (d) { e.preventDefault(); unlockAudio(); if (!e.repeat) queued = d; held = d; return; }
    if ((e.key === 'Enter' || e.key === ' ') && !$('intro').hidden) { e.preventDefault(); start(); }
    else if ((e.key === 'Enter' || e.key === ' ') && !$('dead').hidden) { e.preventDefault(); loadLevel(levelIdx); start(); }
    else if (e.key === 'r' || e.key === 'R') { loadLevel(levelIdx); start(); }
  });
  window.addEventListener('keyup', e => { if (KEYMAP[e.key] === held) held = null; });

  // Swipe on the board: each 24px of drag is a step; keeping the finger down keeps walking.
  let sw = null;
  board.addEventListener('pointerdown', e => { unlockAudio(); sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; board.setPointerCapture(e.pointerId); });
  board.addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (d !== held) queued = d;
    held = d; sw.x = e.clientX; sw.y = e.clientY;
  });
  const endSwipe = e => { if (sw && e.pointerId === sw.id) { sw = null; held = null; } };
  board.addEventListener('pointerup', endSwipe);
  board.addEventListener('pointercancel', endSwipe);

  document.querySelectorAll('#pad button').forEach(btn => {
    const d = btn.dataset.dir;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); btn.setPointerCapture(e.pointerId); queued = d; held = d; btn.classList.add('on'); });
    const up = () => { if (held === d) held = null; btn.classList.remove('on'); };
    btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  $('menuBtn').onclick = showMenu;
  $('restartBtn').onclick = () => { loadLevel(levelIdx); };
  $('startBtn').onclick = start;
  $('retryBtn').onclick = () => { loadLevel(levelIdx); start(); };
  $('nextBtn').onclick = () => { loadLevel(levelIdx === LEVELS.length - 1 ? 0 : levelIdx + 1); };
  document.querySelectorAll('[data-act=menu]').forEach(b => b.onclick = showMenu);
  $('muteBtn').onclick = () => { save.muted = !save.muted; persist(); $('muteBtn').textContent = `Sound: ${save.muted ? 'Off' : 'On'}`; $('muteBtn').setAttribute('aria-pressed', save.muted); };

  // Title art: the hero standing on a chip floor.
  (function titleArt() {
    const cv = $('titleArt'), c = cv.getContext('2d');
    cv.width = cv.height = 96 * 2; c.scale(2, 2);
    drawFloor(c, 0, 0, 48); drawChip(c, 48, 0, 48); drawExit(c, 48, 48, 48, 1); drawFloor(c, 0, 48, 48); drawChip(c, 0, 48, 48);
    drawPlayer(c, { x: 0, y: 0, dir: 'down' }, 12, 12, 72, 0, { t: ['.'], w: 1, boots: {} });
  })();

  window.ChipArt = { drawFloor, drawChip, drawExit, drawPlayer, drawWall };
  resize();
  state = E.load(LEVELS[Math.min(save.unlocked, LEVELS.length) - 1]);
  levelIdx = Math.min(save.unlocked, LEVELS.length) - 1;
  updateHud(); buildInv();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
